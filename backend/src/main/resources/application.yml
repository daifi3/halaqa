server:
  # All interfaces, so phones on the same Wi-Fi can reach it and a changed LAN IP never breaks startup.
  address: ${SERVER_ADDRESS:0.0.0.0}
  # Render sets PORT; locally run-local.ps1 sets SERVER_PORT.
  port: ${PORT:3000}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:halaqa}
    username: ${DB_USER:postgres}
    password: "${DB_PASSWORD:postgres}"
  jpa:
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate only checks it matches the entities.
      ddl-auto: validate
    open-in-view: false
  web:
    resources:
      # Egress writes MP4 files into ./recordings — served at /recordings/<file>
      static-locations: file:./recordings/

  mvc:
    static-path-pattern: /recordings/**

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

halaqa:
  # Address the phone uses to reach this backend (used to build recording URLs).
  public-base-url: ${PUBLIC_BASE_URL:${RENDER_EXTERNAL_URL:http://192.168.1.73:3000}}
  # Sites allowed to call the backend from a browser (the web app in web/). Comma separated, patterns
  # allowed, e.g. WEB_ORIGINS=https://halaqa-web.onrender.com,http://localhost:5173. "*" = any site,
  # which is safe here because the API uses bearer tokens, not cookies (see CorsConfig).
  web-origins: ${WEB_ORIGINS:*}
  push:
    # Phone notifications through Expo's push service (exp.host). Android also needs FCM
    # credentials uploaded to EAS. EXPO_ACCESS_TOKEN only if "enhanced push security" is on.
    enabled: ${PUSH_ENABLED:true}
    access-token: ${EXPO_ACCESS_TOKEN:}
  storage:
    avatar-dir: ${AVATAR_DIR:./data/avatars}
    vault-dir: ${VAULT_DIR:./data/vault}
    homework-dir: ${HOMEWORK_DIR:./data/homework}
  auth:
    # Access tokens are short-lived; the app swaps its refresh token for a new pair when one expires.
    # Once the refresh token expires too, the user has to sign in again.
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:30d}
  livekit:
    # URL the *app* connects to (websocket)
    ws-url: wss://halaqa-087jcbgn.livekit.cloud
    # URL the *backend* uses for server APIs (egress)
    api-url: https://halaqa-087jcbgn.livekit.cloud
    api-key: APIBurB7TwSzoG5
    api-secret: 3GsFangefs03AdR5eRU60uR1x58RmthfUvkF8XosnM8B
    # Path *inside the egress container* where files are written
    egress-output-dir: /out
    # Off on Render: LiveKit Cloud can only record to cloud storage, which isn't set up yet.
    recording-enabled: ${RECORDING_ENABLED:true}

springdoc:
  swagger-ui:
    # Keep the pasted token across page reloads, and list things in a predictable order.
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: alpha
