# Media stack for local development: LiveKit (video), Egress (recording), Redis.
# Run:  docker compose up -d     then start the Spring Boot app with: mvn spring-boot:run
services:
  redis:
    image: redis:7-alpine

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "40000-40100:40000-40100/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [redis]

  egress:
    image: livekit/egress:latest
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./livekit/egress.yaml:/etc/egress.yaml:ro
      # Egress writes MP4s here; Spring Boot serves the same folder at /recordings/**
      - ./recordings:/out
    cap_add: [SYS_ADMIN]
    depends_on: [redis, livekit]
